name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - .claude/**
  pull_request:
    branches: [main]
    paths-ignore:
      - .claude/**
  # Commits a workflow pushes with GITHUB_TOKEN start no other workflow, so the data workflows start this one on their
  # branch; its checks then show on the data pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-lint:
    name: Deno Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The scripts run on Bun; Deno only lints them.
      - name: Deno linter
        run: deno lint

  bun-checks:
    name: Bun Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bun formatter check
        run: bun run format:check

      - name: Bun type check
        run: bun run typecheck

      - name: Bun tests
        run: bun run test

  astro-checks:
    name: Astro Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro

      - name: Run Prettier format check
        run: npm run format:check
        working-directory: astro

      - name: Run Astro type check
        run: npx astro check
        working-directory: astro

      - name: Run tests
        run: npm test -- --run
        working-directory: astro

      - name: Build project
        run: npm run build
        working-directory: astro

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: astro

      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e
        working-directory: astro

      # The review app imports the site's theme and font, so it is checked against the same commit.
      - name: Install review app dependencies
        run: npm ci
        working-directory: session-review

      - name: Lint review app
        run: npm run lint
        working-directory: session-review

      - name: Build review app
        run: npm run build
        working-directory: session-review
