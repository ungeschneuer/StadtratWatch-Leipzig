name: Leipzig data publish

# Brings the reviewers' decisions of the day to the site in the evening: merges the data pull request once its
# decisions are applied and CI is green, and deploys. Data with a new session waits for the operator.

on:
  schedule:
    # Daily at 20:07 UTC (21:07 in winter, 22:07 in summer), after the day's reviews.
    - cron: '7 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  LEIPZIG_DATA_BRANCH: data/leipzig-votings

jobs:
  publish:
    name: Publish the review decisions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge the data pull request and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/leipzig-publish-data.sh
