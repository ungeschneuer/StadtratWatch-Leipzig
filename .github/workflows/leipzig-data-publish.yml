name: Leipzig data publish

# Publishes the data branch in the evening: merges the data pull request once its review decisions are applied and CI is
# green, deploys, and tells the reviewers in a comment what went online, new sessions included.

on:
  schedule:
    # Daily at 20:07 UTC (21:07 in winter, 22:07 in summer), after the day's reviews and the new sessions.
    - cron: '7 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  LEIPZIG_DATA_BRANCH: data/leipzig-votings

jobs:
  publish:
    name: Publish the data branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge the data pull request and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          LEIPZIG_REVIEWERS: ${{ vars.LEIPZIG_REVIEWERS }}
        run: .github/scripts/leipzig-publish-data.sh
