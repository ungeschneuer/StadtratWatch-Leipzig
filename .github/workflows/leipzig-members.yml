name: Leipzig members

on:
  schedule:
    # Daily at 04:43 UTC, before the recordings; an off-the-hour minute avoids the GitHub Actions peak.
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: leipzig-members
  cancel-in-progress: false

jobs:
  members:
    name: Update council members
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A failed plausibility check still writes the files, so the pull request shows what changed.
      - name: Build members
        id: members
        continue-on-error: true
        run: bun src/scripts/leipzig-members/index.ts 2>&1 | tee members.log; exit ${PIPESTATUS[0]}

      # Only the members files: the votes tables live on the voting data branch, where reviewers commit, and the
      # voting workflow writes their faction and party columns from members.json on its next run.
      - name: Propose data changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/leipzig-members
          add-paths: |
            data/leipzig-8/members.json
            data/leipzig-8/persons.csv
            data/leipzig-8/faction-memberships.csv
          commit-message: 'data(leipzig): Mitglieder, Fraktionen und Parteien aktualisieren'
          title: 'data(leipzig): Mitglieder, Fraktionen und Parteien aktualisieren'
          body: |
            Automatisch erzeugt vom Workflow „Leipzig members“ aus OParl und der Bewerberliste 2024.
            Korrekturen gehören in `data/leipzig-8/member-overrides.json`.
          delete-branch: true

      - name: Report failure
        if: steps.members.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Leipzig members: Prüfung fehlgeschlagen'
          body="$(printf 'Lauf: %s/%s/actions/runs/%s\n\nKorrekturen mit Begründung und Quelle in `data/leipzig-8/member-overrides.json`.\n\n```\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -n 40 members.log)")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
