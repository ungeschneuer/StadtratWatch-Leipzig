name: Leipzig recordings

on:
  schedule:
    # Daily at 05:17 UTC; an off-the-hour minute avoids the GitHub Actions peak.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Guess page addresses for every meeting of the period
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: leipzig-recordings
  cancel-in-progress: false

jobs:
  sync:
    name: Sync recordings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync recordings
        id: sync
        continue-on-error: true
        run: bun src/scripts/leipzig-recordings/index.ts ${{ inputs.backfill && '--backfill' || '' }} 2>&1 | tee sync.log; exit ${PIPESTATUS[0]}

      - name: Propose data changes
        id: proposal
        # Rebuilt on every run and deleted after the merge, so outside the protected data/* branches.
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/leipzig-recordings
          add-paths: data/leipzig-8
          commit-message: 'data(leipzig): Aufzeichnungen der Ratsversammlung aktualisieren'
          title: 'data(leipzig): Aufzeichnungen der Ratsversammlung aktualisieren'
          body: Automatisch erzeugt vom Workflow „Leipzig recordings“. Neue oder geänderte Aufzeichnungen und Untertitel.
          delete-branch: true

      # Recordings and subtitles carry no votes, so the pull request is merged as soon as CI passes; the votings workflow
      # then reads the new sessions. Anything else on the branch waits for a human.
      - name: Merge the recordings
        if: steps.proposal.outputs.pull-request-number && steps.proposal.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.proposal.outputs.pull-request-number }}
        run: |
          unexpected="$(gh pr view "$PULL_REQUEST" --json files --jq '.files[].path' |
            grep -vE '^data/leipzig-8/(recordings\.json|[0-9]{4}-[0-9]{2}-[0-9]{2}/subtitles-[0-9-]+\.vtt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::warning::Der Recordings-PR ändert weitere Dateien und wartet auf einen Menschen:"
            echo "$unexpected"
            exit 0
          fi
          head="$(gh pr view "$PULL_REQUEST" --json headRefOid --jq .headRefOid)"
          .github/scripts/wait-for-ci.sh update/leipzig-recordings "$head"
          gh pr merge "$PULL_REQUEST" --merge --match-head-commit "$head" --delete-branch
          # A merge with the workflow token starts no other workflow.
          gh workflow run leipzig-votings.yml --ref main

      - name: Report failure
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Leipzig recordings: Abruf fehlgeschlagen'
          body="$(printf 'Lauf: %s/%s/actions/runs/%s\n\n```\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -n 40 sync.log)")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
